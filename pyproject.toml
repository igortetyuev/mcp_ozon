[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ozon"
version = "0.1.0"
description = "MCP server (stdio) for Ozon buyer data via the user's logged-in Chrome over CDP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<4",
    "websockets>=15",
]

[project.scripts]
mcp-ozon = "mcp_ozon.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ozon"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: tests that drive the user's real Chrome over CDP (deselect with '-m \"not live\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
